      <stop offset="0%" stop-color="#1A1526"/>
      <stop offset="100%" stop-color="#08070E"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="62%" r="52%">
      <stop offset="0%" stop-color="#F5A524" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#F5A524" stop-opacity="0"/>
